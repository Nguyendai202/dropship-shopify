<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 350' role='img' aria-label='Ba công thức viết text quảng cáo cho sản phẩm vật lý'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='350' fill='#ffffff'/><rect x='20' y='50' width='225' height='255' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='132' y='78' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>1. Vấn đề → giải pháp</text><text x='132' y='108' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Nêu nỗi đau khách đang gặp</text><text x='132' y='136' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Giới thiệu sản phẩm là giải pháp</text><text x='132' y='164' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Liệt kê lợi ích, mỗi ý một dòng</text><text x='132' y='262' font-size='10.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ví dụ: giày làm việc nặng,</text><text x='132' y='278' font-size='10.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>hỏi khách có mệt vì đau chân không</text><rect x='265' y='50' width='225' height='255' rx='10' fill='#fff1d6' stroke='#e0b25a' stroke-width='1.5'/><text x='377' y='78' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>2. Giải pháp cho một nhóm</text><text x='377' y='108' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tiêu đề: sản phẩm hoàn hảo cho</text><text x='377' y='124' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>một nhóm cụ thể</text><text x='377' y='152' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Đào sâu vào môi trường của nhóm</text><text x='377' y='180' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Liệt kê lợi ích phù hợp nhóm đó</text><text x='377' y='262' font-size='10.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ví dụ: giày cho người làm công trường,</text><text x='377' y='278' font-size='10.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>không chỉ nói chung chung &quot;cho công việc&quot;</text><rect x='510' y='50' width='225' height='255' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='622' y='78' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>3. Trích dẫn review</text><text x='622' y='108' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mở đầu bằng lời khách thật,</text><text x='622' y='124' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>đặt trong dấu ngoặc kép</text><text x='622' y='152' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Dấu ngoặc kép cho thấy</text><text x='622' y='168' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>đây là lời trích dẫn</text><text x='622' y='196' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Nối sang giải pháp và lợi ích</text><text x='622' y='262' font-size='10.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ví dụ: một dòng review có thật</text><text x='622' y='278' font-size='10.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>của khách đã dùng sản phẩm</text><text x='380.0' y='338' font-size='12.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Luôn đúng ngữ pháp, tối đa 2 emoji, xuống dòng giữa các phần.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ba công thức viết text quảng cáo cho sản phẩm vật lý</text></svg>