<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' role='img' aria-label='Vì sao pixel nên tạo ở Business Manager'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='300' fill='#ffffff'/><rect x='250' y='50' width='260' height='50' rx='10' fill='#fff1d6' stroke='#e0b25a' stroke-width='1.5'/><text x='380.0' y='70.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Business Manager</text><text x='380.0' y='88.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>sở hữu pixel (&quot;cái cốc&quot; chứa dữ liệu)</text><rect x='50' y='170' width='170' height='50' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='135.0' y='199.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tài khoản QC 1</text><line x1='380' y1='102' x2='135' y2='168' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='300' y='170' width='170' height='50' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='385.0' y='199.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tài khoản QC 2</text><line x1='380' y1='102' x2='385' y2='168' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='550' y='170' width='170' height='50' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='635.0' y='199.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tài khoản QC 3 (bị khoá)</text><line x1='380' y1='102' x2='635' y2='168' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><text x='380.0' y='255' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tài khoản nào chạy cũng đổ dữ liệu vào cùng một pixel.</text><text x='380.0' y='278' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tài khoản QC chết thì pixel vẫn còn. Pixel tạo trong từng tài khoản thì mất theo tài khoản.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Vì sao pixel nên tạo ở Business Manager</text></svg>