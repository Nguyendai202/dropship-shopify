<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' role='img' aria-label='Giá trị đơn trung bình: store thường so với funnel (ví dụ từ slide)'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='300' fill='#ffffff'/><text x='20' y='70' font-size='14' fill='#1a2433' font-weight='700' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Store thường</text><rect x='20' y='80' width='429.0' height='34' rx='6' fill='#9db4ea' stroke='#9db4ea' stroke-width='1.5'/><text x='30' y='103' font-size='13' fill='#1a2433' font-weight='600' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>100 đô + upsell ≈ 10 đô = 110 đô</text><text x='20' y='160' font-size='14' fill='#1a2433' font-weight='700' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Funnel</text><rect x='20' y='170' width='390.0' height='34' rx='4' fill='#9db4ea' stroke='#9db4ea' stroke-width='1.5'/><text x='215.0' y='192' font-size='12' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>100 sản phẩm chính</text><rect x='410.0' y='170' width='34.32' height='34' rx='4' fill='#f0b84d' stroke='#f0b84d' stroke-width='1.5'/><rect x='444.32' y='170' width='117.0' height='34' rx='4' fill='#58b97a' stroke='#58b97a' stroke-width='1.5'/><text x='502.82' y='192' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>+30</text><rect x='561.3199999999999' y='170' width='9.75' height='34' rx='4' fill='#e8625a' stroke='#e8625a' stroke-width='1.5'/><text x='579.0699999999999' y='192' font-size='14' fill='#1a2433' font-weight='800' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>≈ 141 đô</text>