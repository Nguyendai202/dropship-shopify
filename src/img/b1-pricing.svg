<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 230' role='img' aria-label='Chiến lược giá &quot;chốt từng bước&quot;'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='230' fill='#ffffff'/><rect x='20' y='60' width='160' height='70' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='100.0' y='90.4' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Thấy giá thấp</text><text x='100.0' y='109.4' font-size='14' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>22,99 đô</text><rect x='220' y='60' width='160' height='70' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='300.0' y='90.4' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Điền thông tin</text><text x='300.0' y='109.4' font-size='14' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>ship, email, địa chỉ</text><rect x='420' y='60' width='160' height='70' rx='10' fill='#fff1d6' stroke='#e0b25a' stroke-width='1.5'/><text x='500.0' y='90.4' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Thấy phí ship</text><text x='500.0' y='109.4' font-size='14' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>9,95 đô</text><rect x='620' y='60' width='120' height='70' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='680.0' y='90.4' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Thanh toán</text><text x='680.0' y='109.4' font-size='14' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>32,94 đô</text><line x1='182' y1='95' x2='218' y2='95' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><line x1='382' y1='95' x2='418' y2='95' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><line x1='582' y1='95' x2='618' y2='95' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><text x='380.0' y='165' font-size='14' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Thị trường bán ~30 đô, ship miễn phí  →  mình bán 22,99 đô + ship 9,95 đô</text><text x='380.0' y='190' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tổng tiền gần bằng, nhưng khách đã đầu tư công điền thông tin nên ít bỏ ở bước cuối.</text><text x='380.0' y='215' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Giá gạch ngang (giá gốc 49 đô) chỉ để tạo cảm giác giảm giá.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Chiến lược giá &quot;chốt từng bước&quot;</text></svg>