<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 260' role='img' aria-label='Đường đi của khách trong một funnel bán hàng'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='260' fill='#ffffff'/><rect x='12' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='76' y='90' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Sản phẩm chính</text><text x='76' y='118' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>trang bán hàng</text><line x1='142' y1='120' x2='160' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='162' y='60' width='128' height='120' rx='10' fill='#fff1d6' stroke='#e0b25a' stroke-width='1.5'/><text x='226' y='90' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Order bump</text><text x='226' y='118' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>tick thêm ngay</text><text x='226' y='135' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>tại bước thanh toán</text><line x1='292' y1='120' x2='310' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='312' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='376' y='90' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Upsell 1</text><text x='376' y='118' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>mời mua sản phẩm</text><text x='376' y='135' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>đắt hơn, 1 click</text><line x1='442' y1='120' x2='460' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='462' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='526' y='90' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Upsell 2</text><text x='526' y='118' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>hoặc mua thêm số</text><text x='526' y='135' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>lượng, downsell</text><line x1='592' y1='120' x2='610' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='612' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='676' y='90' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Thank you</text><text x='676' y='118' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>chỉ hiện khi hết</text><text x='676' y='135' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>sản phẩm để mời</text><text x='380.0' y='215' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mỗi bước thêm là một cơ hội kiếm thêm tiền từ cùng một khách, nên funnel càng sâu càng có lợi.</text><text x='380.0' y='238' font-size='12.5' fill='#8a96ac' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Chỉ dùng khi sản phẩm đã thắng: funnel là phương tiện, không cứu được sản phẩm kém.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Đường đi của khách trong một funnel bán hàng</text></svg>