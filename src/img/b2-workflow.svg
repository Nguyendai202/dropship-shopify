<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 250' role='img' aria-label='Quy trình chọn sản phẩm: từ nhiều ý tưởng đến một sản phẩm đưa lên store'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='250' fill='#ffffff'/><rect x='12' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='76' y='88' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mindset</text><text x='76' y='115' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>thị trường quyết định,</text><text x='76' y='133' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>không chờ ai cho cá</text><line x1='142' y1='120' x2='160' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='162' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='226' y='88' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Tìm nguồn</text><text x='226' y='115' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Google Trend, tool săn</text><text x='226' y='133' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>sp, quảng cáo đối thủ</text><line x1='292' y1='120' x2='310' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='312' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='376' y='88' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Lọc tiêu chí</text><text x='376' y='115' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>margin, logo, kích thước,</text><text x='376' y='133' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>hàng có sẵn ở siêu thị</text><line x1='442' y1='120' x2='460' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='462' y='60' width='128' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='526' y='88' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ghi vào file</text><text x='526' y='115' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>~10 sản phẩm, ước giá,</text><text x='526' y='133' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>lợi thế cạnh tranh</text><line x1='592' y1='120' x2='610' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='612' y='60' width='128' height='120' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='676' y='88' font-size='14' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Chốt 1 sản phẩm</text><text x='676' y='115' font-size='11' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>đưa lên store ngay</text><text x='380.0' y='215' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Càng bắt