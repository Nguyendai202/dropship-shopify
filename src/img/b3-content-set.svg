<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 260' role='img' aria-label='Bộ content cho một sản phẩm: chữ, ảnh, video'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='260' fill='#ffffff'/><rect x='20' y='60' width='163' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='101' y='90' font-size='15' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Text</text><text x='101' y='118' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>3 công thức,</text><text x='101' y='136' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>check ngữ pháp</text><line x1='185' y1='120' x2='201' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='203' y='60' width='163' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='284' y='90' font-size='15' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ảnh vuông</text><text x='284' y='118' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>≥ 900 px, thường 1080,</text><text x='284' y='136' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>làm trên Canva</text><line x1='368' y1='120' x2='384' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='386' y='60' width='163' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='467' y='90' font-size='15' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Video</text><text x='467' y='118' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>dọc hoặc vuông,</text><text x='467' y='136' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>có nhạc, tải về không logo</text><line x1='551' y1='120' x2='567' y2='120' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='569' y='60' width='163' height='120' rx='10' fill='#eaf0ff' stroke='#9db4ea' stroke-width='1.5'/><text x='650' y='90' font-size='15' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>File theo dõi</text><text x='650' y='118' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>dán link, sản phẩm,</text><text x='650' y='136' font-size='11.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>điền vào bảng thực hành</text><text x='380.0' y='215' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Chưa test thì chưa biết sản phẩm hợp ảnh hay hợp video, nên chuẩn bị cả hai.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Bộ content cho một sản phẩm: chữ, ảnh, video</text></svg>