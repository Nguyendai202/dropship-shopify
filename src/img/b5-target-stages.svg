<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 260' role='img' aria-label='Ba giai đoạn target trên Facebook'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='260' fill='#ffffff'/><rect x='20' y='55' width='225' height='150' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='132' y='85' font-size='16' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>1. Chính xác</text><text x='132' y='115' font-size='12.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>người nổi tiếng, thương hiệu,</text><text x='132' y='134' font-size='12.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>cụm từ ≥ 3 chữ, kết hợp 2 sở thích</text><text x='132' y='185' font-size='13' fill='#5a6b8c' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>khi mới test</text><line x1='247' y1='130' x2='263' y2='130' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='265' y='55' width='225' height='150' rx='10' fill='#fff1d6' stroke='#e0b25a' stroke-width='1.5'/><text x='377' y='85' font-size='16' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>2. Rộng</text><text x='377' y='115' font-size='12.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>tệp hàng chục triệu người</text><text x='377' y='185' font-size='13' fill='#5a6b8c' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>khi pixel đã có dữ liệu</text><line x1='492' y1='130' x2='508' y2='130' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='510' y='55' width='225' height='150' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='622' y='85' font-size='16' fill='#1a2433' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>3. Không target</text><text x='622' y='115' font-size='12.5' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>để Facebook tự tìm</text><text x='622' y='185' font-size='13' fill='#5a6b8c' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>khi scale mạnh</text><text x='380.0' y='238' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Pixel càng có nhiều dữ liệu càng thông minh, nên có thể mở rộng dần.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Ba giai đoạn target trên Facebook</text></svg>