<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 270' role='img' aria-label='Vòng quay vốn của brand (ví dụ giảng viên)'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='270' fill='#ffffff'/><rect x='20' y='55' width='225' height='150' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='132' y='82' font-size='16' fill='#2457d6' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Vòng 1</text><text x='132' y='112' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Nhập 100 cái</text><text x='132' y='135' font-size='12.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>giá vốn 15 đô = 1.500 đô</text><text x='132' y='175' font-size='14' fill='#2f7a4b' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Bán hết ≈ 6.000 đô</text><line x1='247' y1='130' x2='263' y2='130' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='265' y='55' width='225' height='150' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='377' y='82' font-size='16' fill='#2457d6' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Vòng 2</text><text x='377' y='112' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Nhập 300 cái</text><text x='377' y='135' font-size='12.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>4.500 đô + 1.500 đô marketing</text><text x='377' y='175' font-size='14' fill='#2f7a4b' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Bán hết ≈ 13.000 đô</text><line x1='492' y1='130' x2='508' y2='130' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='510' y='55' width='225' height='150' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='622' y='82' font-size='16' fill='#2457d6' font-weight='800' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Vòng 3</text><text x='622' y='112' font-size='14' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Nhập tiếp, nhiều hơn</text><text x='622' y='135' font-size='12.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>mở thêm sản phẩm, kênh</text><text x='622' y='175' font-size='14' fill='#2f7a4b' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mở rộng dần</text><text x='380.0' y='235' font-size='12.5' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Vốn quay vòng nội tại khá chậm, vì vậy nhiều brand phải gọi vốn và phải dự báo doanh số để chuẩn bị hàng.</text><text x='380.0' y='255' font-size='12' fill='#8a96ac' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Số liệu là ví dụ minh hoạ trong bài giảng, không phải cam kết.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Vòng quay vốn của brand (ví dụ giảng viên)</text></svg>