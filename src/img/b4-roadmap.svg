u</text><line x1='552' y1='110' x2='573' y2='110' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='575' y='70' width='160' height='80' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='655.0' y='105.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Scale Facebook</text><text x='655.0' y='123.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>nguồn doanh số chính</text><text x='380.0' y='190' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Giảng viên: ~90% doanh số của ông vẫn đến từ Facebook; TikTok rẻ hơn nhưng content khó giữ lâu.</text><text x='380.0' y='215' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Sản phẩm thắng trên TikTok thường chạy được trên Facebook, ngược lại chưa chắc.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Lộ trình chạy quảng cáo: test rẻ trên TikTok, scale trên Facebook</text></svg>