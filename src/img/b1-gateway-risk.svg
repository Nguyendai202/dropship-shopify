<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' role='img' aria-label='Cổng trả tiền càng nhanh, càng dễ bị hold hoặc ban'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='300' fill='#ffffff'/><rect x='40' y='70' width='680' height='16' rx='8' fill='#ffffff' stroke='#d5dbe8' stroke-width='1.5'/><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#e8625a'/><stop offset='0.5' stop-color='#f0b84d'/><stop offset='1' stop-color='#58b97a'/></linearGradient></defs><rect x='40' y='70' width='680' height='16' rx='8' fill='url(#g)'/><text x='40' y='62' font-size='12.5' fill='#a03a33' font-weight='700' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Payout nhanh, rủi ro cao</text><text x='720' y='62' font-size='12.5' fill='#2f7a4b' font-weight='700' text-anchor='end' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Payout chậm, rủi ro thấp</text><circle cx='100' cy='78' r='9' fill='#ffffff' stroke='#1a2433' stroke-width='2.5'/><rect x='20' y='115' width='160' height='100' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='100.0' y='151.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>PayPal</text><text x='100.0' y='169.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>ngay lập tức</text><text x='100.0' y='187.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>hold đến ~21 ngày</text><line x1='100' y1='88' x2='100' y2='115' stroke='#9aa7c0' stroke-width='1.5'/><circle cx='270' cy='78' r='9' fill='#ffffff' stroke='#1a2433' stroke-width='2.5'/><rect x='190' y='115' width='160' height='100' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='270.0' y='151.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Affirm</text><text x='270.0' y='169.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>1–3 ngày</text><text x='270.0' y='187.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>cần công ty US</text><line x1='270' y1='88' x2='270' y2='115' stroke='#9aa7c0' stroke-width='1.5'/><circle cx='450' cy='78' r='9' fill='#ffffff' stroke='#1a2433' stroke-width='2.5'/><rect x='370' y='115' width='160' height='100' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='450.0' y='151.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Stripe / Shopify Pay</text><text x='450.0' y='169.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>2–7 ngày</text><text x='450.0' y='187.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>cần công ty UK/US</text><line x1='450' y1='88' x2='450' y2='115' stroke='#9aa7c0' stroke-width='1.5'/><circle cx='640' cy='78' r='9' fill='#ffffff' stroke='#1a2433' stroke-width='2.5'/><rect x='560' y='115' width='160' height='100' rx='10' fill='#f4f7fd' stroke='#c9d3e6' stroke-width='1.5'/><text x='640.0' y='151.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Cổng chuyển hướng</text><text x='640.0' y='169.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>10–14 ngày</text><text x='640.0' y='187.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>giữ 10% / 180 ngày</text><line x1='640' y1='88' x2='640' y2='115' stroke='#9aa7c0' stroke-width='1.5'/><text x='380.0' y='250' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Chargeback thường kèm phí 15–20 đô/lần; nhiều quá cổng sẽ từ chối làm việc với bạn.</text><text x='380.0' y='275' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>PayPal: chỉ nên dùng khi test vài đơn đầu hoặc khi đã có brand ổn định.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Cổng trả tiền càng nhanh, càng dễ bị hold hoặc ban</text></svg>