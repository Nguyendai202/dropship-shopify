<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 360' role='img' aria-label='Hai cách fulfill: giao thẳng từ Trung Quốc và qua kho Mỹ'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5a6b8c'/></marker></defs><rect width='760' height='360' fill='#ffffff'/><text x='20' y='62' font-size='14' fill='#a03a33' font-weight='700' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>A. Dropship từ Trung Quốc  (10–20 ngày)</text><rect x='20' y='75' width='150' height='60' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='95.0' y='100.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Khách đặt</text><text x='95.0' y='118.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>đơn</text><line x1='172' y1='105' x2='198' y2='105' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='200' y='75' width='150' height='60' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='275.0' y='100.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mình gửi đơn</text><text x='275.0' y='118.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>cho supplier</text><line x1='352' y1='105' x2='378' y2='105' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='380' y='75' width='150' height='60' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='455.0' y='100.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Supplier ship</text><text x='455.0' y='118.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>và gửi tracking</text><line x1='532' y1='105' x2='558' y2='105' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='560' y='75' width='150' height='60' rx='10' fill='#fde8e6' stroke='#e8a49e' stroke-width='1.5'/><text x='635.0' y='100.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mình báo</text><text x='635.0' y='118.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>tracking, trả tiền</text><text x='20' y='195' font-size='14' fill='#2f7a4b' font-weight='700' text-anchor='start' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>B. Qua kho 3PL tại Mỹ  (≈ 2–3,5 ngày làm việc)</text><rect x='20' y='208' width='150' height='60' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='95.0' y='233.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mình nhập hàng</text><text x='95.0' y='251.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>về kho Mỹ</text><line x1='172' y1='238' x2='198' y2='238' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='200' y='208' width='150' height='60' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='275.0' y='233.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Khách đặt</text><text x='275.0' y='251.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>đơn</text><line x1='352' y1='238' x2='378' y2='238' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='380' y='208' width='150' height='60' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='455.0' y='233.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Mình gửi đơn</text><text x='455.0' y='251.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>cho kho</text><line x1='532' y1='238' x2='558' y2='238' stroke='#5a6b8c' stroke-width='2.2' marker-end='url(#a)'/><rect x='560' y='208' width='150' height='60' rx='10' fill='#e5f6ea' stroke='#8fcfa3' stroke-width='1.5'/><text x='635.0' y='233.55' font-size='13' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Kho đóng gói,</text><text x='635.0' y='251.55' font-size='13' fill='#1a2433' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>ship, cập nhật tracking</text><text x='380.0' y='310' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Kho Mỹ giao nhanh nhưng phải nhập hàng trước và trả phí dịch vụ, phí xử lý, phụ phí đóng gói.</text><text x='380.0' y='335' font-size='13' fill='#5a6b8c' font-weight='400' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Chọn A khi test sản phẩm, chọn B khi đã có brand và muốn giao nhanh.</text><text x='380.0' y='30' font-size='17' fill='#1a2433' font-weight='700' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>Hai cách fulfill: giao thẳng từ Trung Quốc và qua kho Mỹ</text></svg>